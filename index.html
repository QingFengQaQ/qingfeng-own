<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清风 · 个人网站</title>
  <meta name="description" content="整合首页、技能、业务、教学，单页模板" />
  <style>

    /* ^_^ 不会真的有人连屎都要抄吧? ^_^ */
    /* ^_^ 抄图片设计我会追究你责任的 ^_^ */

    /* ===== 全局样式 (基于原 style.css 精简整合) ===== */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", "PingFang SC", "Microsoft YaHei", "Segoe UI", serif;
      color: #1f1d1c;
      background: #f4efe8;
      line-height: 1.75;
      transition: filter 0.2s ease;
    }

    body.is-dim {
      filter: brightness(0.82) saturate(0.9);
    }

    img {
      max-width: 100%;
      display: block;
    }

    svg {
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .container {
      width: min(1160px, calc(100% - 24px));
      margin: 0 auto;
    }

    /* ===== 头部 ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #f7f2ec;
      border-bottom: 1px solid rgba(31, 29, 28, 0.06);
    }

    .topbar {
      min-height: 56px;
      display: grid;
      grid-template-columns: minmax(90px, 0.9fr) minmax(0, 2fr) minmax(70px, 0.8fr);
      align-items: center;
      gap: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-width: 0;
      overflow: visible;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: block;
      border-radius: 50%;
      background: #121212;
      color: #fff;
      font-weight: 700;
      box-shadow: none;
      flex-shrink: 0;
      overflow: hidden;
      object-fit: cover;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      min-width: 0;
    }

    .brand-text strong {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
    }

    .brand-text span {
      font-size: 0.6rem;
      color: #8d847d;
      letter-spacing: 0.12em;
      white-space: nowrap;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
    }

    .main-nav {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 5px;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 0 0 0 2px;
    }

    .main-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-link {
      flex: 0 0 auto;
      border: 1px solid rgba(31, 29, 28, 0.12);
      background: rgba(255, 255, 255, 0.22);
      color: #6f6560;
      padding: 5px 8px;
      border-radius: 11px;
      transition: all 0.18s ease;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(17, 17, 17, 0.08);
      border-color: rgba(31, 29, 28, 0.18);
      color: #1f1d1c;
    }

    .header-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex-shrink: 0;
    }

    .music-toggle,
    .brightness-toggle {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1px solid rgba(31, 29, 28, 0.08);
      background: rgba(255,255,255,0.45);
      color: #1f1d1c;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 0.62rem;
    }

    .music-toggle:hover,
    .brightness-toggle:hover {
      transform: translateY(-1px);
      box-shadow: none;
    }

    /* 音乐开启（正在播放）状态 */
    .music-toggle.is-playing {
      background: rgba(22, 26, 29, 0.92);
      color: #fff;
      border-color: rgba(22, 26, 29, 0.95);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    /* 音乐关闭状态 */
    .music-toggle.is-muted {
      background: rgba(255, 255, 255, 0.45);
      color: #8d847d;
      border-color: rgba(31, 29, 28, 0.08);
    }

    .brightness-toggle.is-dim {
      background: rgba(120, 112, 104, 0.18);
      color: #1f1d1c;
      border-color: rgba(31, 29, 28, 0.1);
    }

    /* ===== 副导航 ===== */
    .subnav-wrap {
      padding: 0 0 6px;
    }

    .sub-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      padding: 2px 2px 4px;
      white-space: nowrap;
    }

    .sub-nav::-webkit-scrollbar {
      display: none;
    }

    .sub-link {
      flex: 0 0 auto;
      min-width: 74px;
      text-align: center;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(31, 29, 28, 0.08);
      background: rgba(255,255,255,0.2);
      color: #6f6560;
      font-size: clamp(0.52rem, 1vw, 0.68rem);
      letter-spacing: 0.06em;
      transition: all 0.18s ease;
      box-shadow: none;
      cursor: pointer;
    }

    .sub-link:hover,
    .sub-link.active {
      background: rgba(17, 17, 17, 0.9);
      color: #fff;
      border-color: rgba(17, 17, 17, 0.9);
      transform: none;
      box-shadow: none;
    }

    /* ===== 页面主体 ===== */
    .page-shell {
      width: 100%;
      max-width: none;
      padding: 0;
      margin: 0;
    }

    .svg-mosaic {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    .subnav-panels {
      width: 100%;
    }

    .sub-panel {
      display: none;
    }

    .sub-panel.active {
      display: block;
    }

    .svg-mosaic img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      background: transparent;
      margin: 0;
      border: none;
      box-shadow: none;
      transform: translateY(0);
    }

    .svg-mosaic img + img {
      margin-top: -2px;
    }

    .svg-mosaic img {
      background-color: #ffffff;
      min-height: 80px;
    }

  .footer {
    display: block;
    text-align: center;
    padding: 5px 5px;
    font-size: 0.5rem;
    color: #8d847d;
    letter-spacing: 0.08em;
    border-top: 0px solid rgba(31, 29, 28, 0.06);
    background: #ffffff;
    font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
  }

    /* 移动端适配 */
    @media (max-width: 900px) {
      .svg-mosaic {
        grid-template-columns: 1fr;
      }

      .svg-mosaic img {
        border-right: none;
        border-bottom: none;
      }

      .svg-mosaic img + img {
        margin-top: -1px;
      }
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 12px, 100%);
      }

      .site-header {
        padding: 0;
      }

      .topbar {
        grid-template-columns: auto minmax(0, 1fr) auto;
        min-height: 46px;
        gap: 2px;
        padding: 3px 0 2px;
      }

      .brand {
        gap: 4px;
        min-width: 0;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .brand-text strong {
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
      }

      .brand-text span {
        display: none;
      }

      .main-nav {
        justify-content: flex-start;
        gap: 3px;
        padding-left: 2px;
      }

      .nav-link {
        padding: 4px 5px;
        letter-spacing: 0.02em;
        font-size: 0.48rem;
        font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
        border-width: 1px;
      }

      .header-tools {
        gap: 3px;
      }

      .music-toggle,
      .brightness-toggle {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        font-size: 0.58rem;
      }

      .subnav-wrap {
        padding: 0 0 4px;
      }

      .sub-nav {
        gap: 3px;
        padding: 0 0 1px;
      }

      .sub-link {
        min-width: 52px;
        padding: 4px 6px;
        font-size: 0.5rem;
        font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
      }
    }

    #year {
      display: none;
    }

    .sub-panel {
      animation: fade 0.2s ease;
    }

    @keyframes fade {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }
  </style>
</head>
<body data-page="index">

   <!-- 预置音频池：1.mp3 ~ 20.mp3，每个都是独立 audio 元素 -->
  <div id="musicPool" style="display:none;">
    <audio preload="auto" loop src="1.mp3"></audio>
    <audio preload="auto" loop src="2.mp3"></audio>
    <audio preload="auto" loop src="3.mp3"></audio>
    <audio preload="auto" loop src="4.mp3"></audio>
    <audio preload="auto" loop src="5.mp3"></audio>
  </div>

  <!-- ===== 头部 ===== -->
  <header class="site-header">
    <div class="container topbar">
      <div class="brand" aria-label="网站品牌">
        <div class="brand-mark">
          <img src="tx.png" alt="品牌头像" onerror="this.style.display='none'; this.parentNode.textContent='Q';" />
        </div>
        <div class="brand-text">
          <strong>清风</strong>
          <span>PERSONAL SITE</span>
        </div>
      </div>

      <nav class="main-nav" aria-label="主导航">
        <a class="nav-link active" data-page="index" href="javascript:void(0)">首页</a>
        <a class="nav-link" data-page="skill" href="javascript:void(0)">技能</a>
        <a class="nav-link" data-page="business" href="javascript:void(0)">业务</a>
        <a class="nav-link" data-page="teach" href="javascript:void(0)">教学</a>
      </nav>

      <div class="header-tools" aria-label="工具栏">
        <button class="music-toggle" type="button" aria-label="音乐开关" aria-pressed="false">♪</button>
        <button class="brightness-toggle" type="button" aria-label="亮度调节" aria-pressed="false" title="亮度调节">☀</button>
      </div>
    </div>

    <div class="container subnav-wrap" id="subnavContainer">
    </div>
  </header>

  <!-- ===== 主内容区域 ===== -->
  <main class="page-shell">
    <div class="subnav-panels" id="panelsContainer">
    </div>
  </main>

  <!-- ===== 底部 ===== -->
  <footer class="footer">
    © <span id="year"></span> 清风 · Design by 清风</br>All Rights Reserved.
  </footer>

  <script>
    (function() {
      // ---------- 配置数据 ----------
      const PAGES = [
        {
          id: 'index',
          label: '首页',
          panels: [
            {
              id: 'home',
              label: '首页',
              images: ['01.svg']
            }
          ],
          subNav: []
        },
        {
          id: 'skill',
          label: '技能',
          subNav: [
            { id: 'overview', label: '00 概览' },
            { id: 'design', label: '01 技能' },
            { id: 'brand', label: '02 技能' },
            { id: 'content', label: '03 技能' },
            { id: 'system', label: '04 技能' }
          ],
          panels: [
            { id: 'overview', images: ['11.svg'] },
            { id: 'design', images: ['12.svg'] },
            { id: 'brand', images: ['13.svg'] },
            { id: 'content', images: ['14.svg'] },
            { id: 'system', images: ['15.svg'] }
          ]
        },
        {
          id: 'business',
          label: '业务',
          subNav: [
            { id: 'overview', label: '00 概览' },
            { id: 'plan', label: '01 业务' },
            { id: 'service', label: '02 业务' },
            { id: 'budget', label: '03 业务' },
            { id: 'cooperate', label: '04 业务' }
          ],
          panels: [
            { id: 'overview', images: ['21.svg'] },
            { id: 'plan', images: ['22.svg'] },
            { id: 'service', images: ['23.svg'] },
            { id: 'budget', images: ['24.svg'] },
            { id: 'cooperate', images: ['25.svg'] }
          ]
        },
        {
          id: 'teach',
          label: '教学',
          subNav: [
            { id: 'overview', label: '00 概览' },
            { id: 'course', label: '01 教学' },
            { id: 'method', label: '02 教学' },
            { id: 'case', label: '03 教学' },
            { id: 'reserve', label: '04 教学' }
          ],
          panels: [
            { id: 'overview', images: ['31.svg'] },
            { id: 'course', images: ['32.svg'] },
            { id: 'method', images: ['33.svg'] },
            { id: 'case', images: ['34.svg'] },
            { id: 'reserve', images: ['35.svg'] }
          ]
        }
      ];

      // ---------- 状态 ----------
      let currentPageId = 'index';
      let currentPanelId = 'home';

      // ---------- DOM 元素 ----------
      const navLinks = document.querySelectorAll('.nav-link');
      const subnavContainer = document.getElementById('subnavContainer');
      const panelsContainer = document.getElementById('panelsContainer');

      // ---------- 渲染子导航 ----------
      function renderSubNav() {
        const page = PAGES.find(p => p.id === currentPageId);
        if (!page) return;
        subnavContainer.innerHTML = '';

        if (!page.subNav || page.subNav.length === 0) {
          const emptyNav = document.createElement('div');
          emptyNav.className = 'sub-nav';
          emptyNav.style.justifyContent = 'center';
          emptyNav.style.padding = '2px 0 4px';
          emptyNav.innerHTML = '<span style="font-size:0.6rem; color:#8d847d; letter-spacing:0.1em;">清风 · 个人网站 · 按钮可滑动</span>';
          subnavContainer.appendChild(emptyNav);
          return;
        }

        const nav = document.createElement('nav');
        nav.className = 'sub-nav';
        nav.setAttribute('aria-label', '子导航');

        page.subNav.forEach(item => {
          const a = document.createElement('a');
          a.className = 'sub-link' + (item.id === currentPanelId ? ' active' : '');
          a.href = 'javascript:void(0)';
          a.textContent = item.label;
          a.dataset.panel = item.id;
          a.addEventListener('click', (e) => {
            e.preventDefault();
            currentPanelId = item.id;
            document.querySelectorAll('.sub-link').forEach(link => {
              link.classList.toggle('active', link.dataset.panel === currentPanelId);
            });
            document.querySelectorAll('.sub-panel').forEach(panel => {
              panel.classList.toggle('active', panel.dataset.panel === currentPanelId);
            });
            document.body.dataset.panel = currentPanelId;
          });
          nav.appendChild(a);
        });
        subnavContainer.appendChild(nav);
      }

      // ---------- 渲染所有面板 ----------
      function renderPanels() {
        const page = PAGES.find(p => p.id === currentPageId);
        if (!page) return;

        panelsContainer.innerHTML = '';

        if (page.id === 'index') {
          const panelDiv = document.createElement('section');
          panelDiv.className = 'sub-panel active';
          panelDiv.dataset.panel = 'home';
          panelDiv.setAttribute('aria-label', '首页内容');

          const mosaicDiv = document.createElement('div');
          mosaicDiv.className = 'svg-mosaic';

          page.panels[0].images.forEach((src, idx) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `首页 SVG ${idx + 1}`;
            img.onerror = function() {
              this.style.backgroundColor = '#e9e1d8';
              this.style.minHeight = '100px';
              this.alt = '图片缺失';
            };
            mosaicDiv.appendChild(img);
          });

          panelDiv.appendChild(mosaicDiv);
          panelsContainer.appendChild(panelDiv);
          return;
        }

        page.panels.forEach(panel => {
          const panelDiv = document.createElement('section');
          panelDiv.className = 'sub-panel' + (panel.id === currentPanelId ? ' active' : '');
          panelDiv.dataset.panel = panel.id;
          panelDiv.setAttribute('aria-label', (page.subNav.find(s => s.id === panel.id)?.label || panel.id) + '内容');

          const mosaicDiv = document.createElement('div');
          mosaicDiv.className = 'svg-mosaic';

          panel.images.forEach((src, idx) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `${page.label} ${panel.id} SVG ${idx + 1}`;
            img.onerror = function() {
              this.style.backgroundColor = '#e9e1d8';
              this.style.minHeight = '100px';
              this.alt = '图片缺失';
            };
            mosaicDiv.appendChild(img);
          });

          panelDiv.appendChild(mosaicDiv);
          panelsContainer.appendChild(panelDiv);
        });
      }

      // ---------- 切换板块 ----------
      function switchPage(pageId) {
        const page = PAGES.find(p => p.id === pageId);
        if (!page) return;

        currentPageId = pageId;
        if (pageId === 'index') {
          currentPanelId = 'home';
        } else {
          currentPanelId = page.subNav[0]?.id || '';
        }

        navLinks.forEach(link => {
          const linkPage = link.dataset.page;
          link.classList.toggle('active', linkPage === pageId);
        });

        document.body.dataset.page = pageId;

        renderSubNav();
        renderPanels();
      }

      // ---------- 初始化导航 ----------
      function initNavigation() {
        navLinks.forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const pageId = link.dataset.page;
            if (pageId && pageId !== currentPageId) {
              switchPage(pageId);
            }
          });
        });

        switchPage('index');
      }

      // ============================================================
      // 音乐控制模块 —— 随机选曲、单曲循环、切换页面不中断
      // 方案：预置 audio 池，JS 只负责选中一个播放
      // 需要配合 HTML 中的 <div id="musicPool"> 使用
      // ============================================================
      
      const MUSIC_ENABLED_KEY = 'site-music-enabled-session-v1';

      let currentAudio = null;            // 当前正在使用的 audio 元素
      let unlockListenersAttached = false;

      // 获取音频池中的所有 audio 元素
      function getAllAudios() {
        const pool = document.getElementById('musicPool');
        if (!pool) return [];
        return Array.from(pool.querySelectorAll('audio'));
      }

      // 随机选一个 audio（即随机选一首歌）
      function pickRandomAudio() {
        const list = getAllAudios();
        if (list.length === 0) return null;
        return list[Math.floor(Math.random() * list.length)];
      }

      // 读取开关状态（sessionStorage，关闭标签页后清除）
      function getMusicEnabled() {
        try {
          const stored = sessionStorage.getItem(MUSIC_ENABLED_KEY);
          if (!stored) return true;
          const parsed = JSON.parse(stored);
          return parsed.enabled !== false;
        } catch (e) {
          return true;
        }
      }

      function setMusicEnabled(enabled) {
        try {
          sessionStorage.setItem(MUSIC_ENABLED_KEY, JSON.stringify({ enabled }));
        } catch (e) {}
      }

      // 更新按钮外观（图标 + 样式）
      function updateMusicButton(isPlaying) {
        const btn = document.querySelector('.music-toggle');
        if (!btn) return;
        btn.classList.toggle('is-playing', isPlaying);
        btn.classList.toggle('is-muted', !isPlaying);
        btn.textContent = isPlaying ? '♫' : '♪';
        btn.setAttribute('aria-pressed', String(isPlaying));
        btn.setAttribute('aria-label', isPlaying ? '音乐已开启，点击关闭' : '音乐已关闭，点击开启');
      }

      // 尝试播放当前选中的音频，返回 Promise<boolean>
      function tryPlayMusic() {
        if (!currentAudio) return Promise.resolve(false);
        if (!currentAudio.paused) {
          updateMusicButton(true);
          return Promise.resolve(true);
        }
        const p = currentAudio.play();
        if (p && typeof p.then === 'function') {
          return p.then(() => {
            updateMusicButton(true);
            setMusicEnabled(true);
            return true;
          }).catch((err) => {
            console.warn('音乐播放被阻止：', err.message || err);
            updateMusicButton(true);
            return false;
          });
        }
        updateMusicButton(true);
        return Promise.resolve(true);
      }

      // 暂停当前音乐
      function pauseMusic() {
        if (currentAudio) currentAudio.pause();
        updateMusicButton(false);
      }

      // 用户交互解锁监听：持续尝试，播放成功才移除
      function attachUnlockListeners() {
        if (unlockListenersAttached) return;
        unlockListenersAttached = true;

        const tryUnlock = () => {
          if (getMusicEnabled() && currentAudio && currentAudio.paused) {
            tryPlayMusic().then((ok) => {
              if (ok) removeUnlockListeners();
            });
          } else if (currentAudio && !currentAudio.paused) {
            removeUnlockListeners();
          }
        };

        window.__unlockHandler = tryUnlock;
        document.addEventListener('click', tryUnlock);
        document.addEventListener('touchstart', tryUnlock);
        document.addEventListener('keydown', tryUnlock);
        document.addEventListener('scroll', tryUnlock, { passive: true });
        document.addEventListener('mousemove', tryUnlock);
      }

      function removeUnlockListeners() {
        const h = window.__unlockHandler;
        if (!h) return;
        document.removeEventListener('click', h);
        document.removeEventListener('touchstart', h);
        document.removeEventListener('keydown', h);
        document.removeEventListener('scroll', h);
        document.removeEventListener('mousemove', h);
        window.__unlockHandler = null;
        unlockListenersAttached = false;
      }

      // 初始化音乐
      function initMusic() {
        // 从池中随机选一个（每次页面加载都会重新随机）
        currentAudio = pickRandomAudio();
        if (!currentAudio) {
          console.warn('未找到音乐池中的音频元素，请检查 HTML 中的 #musicPool。');
          updateMusicButton(false);
          return;
        }

        // 设置音量和循环，暂停其他音频
        getAllAudios().forEach(a => {
          a.loop = true;
          a.volume = 0.35;
          if (a !== currentAudio) a.pause();
        });

        const enabled = getMusicEnabled();
        updateMusicButton(enabled);

        if (enabled) {
          tryPlayMusic();
          attachUnlockListeners();
        }

        // 绑定音乐按钮点击事件
        const musicBtn = document.querySelector('.music-toggle');
        if (musicBtn) {
          musicBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();

            const enabledNow = getMusicEnabled();
            if (enabledNow) {
              pauseMusic();
              setMusicEnabled(false);
            } else {
              setMusicEnabled(true);
              tryPlayMusic();
            }
          };
        }
      }

      
      // ---------- 初始化亮度 ----------
      function initBrightness() {
        const brightnessBtn = document.querySelector('.brightness-toggle');
        if (!brightnessBtn) return;

        brightnessBtn.onclick = () => {
          const isDim = !document.body.classList.contains('is-dim');
          document.body.classList.toggle('is-dim', isDim);
          brightnessBtn.classList.toggle('is-dim', isDim);
          brightnessBtn.textContent = isDim ? '☾' : '☀';
          brightnessBtn.setAttribute('aria-pressed', String(isDim));
        };
      }

      // ---------- 页面初始化 ----------
      document.addEventListener('DOMContentLoaded', () => {
        const yearNode = document.getElementById('year');
        if (yearNode) {
          yearNode.textContent = new Date().getFullYear();
        }

        initNavigation();

        // 确保工具栏按钮存在
        const headerTools = document.querySelector('.header-tools');
        if (headerTools) {
          if (!headerTools.querySelector('.music-toggle')) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'music-toggle';
            btn.setAttribute('aria-label', '音乐开关');
            btn.setAttribute('aria-pressed', 'false');
            btn.textContent = '♪';
            headerTools.insertBefore(btn, headerTools.firstChild);
          }
          if (!headerTools.querySelector('.brightness-toggle')) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'brightness-toggle';
            btn.setAttribute('aria-label', '亮度调节');
            btn.setAttribute('title', '亮度调节');
            btn.textContent = '☀';
            headerTools.appendChild(btn);
          }
        }

        // 初始化音乐
        initMusic();

        // 初始化亮度
        initBrightness();
      });

    })();
  </script>
</body>
</html>
